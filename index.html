<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>manpowersupply | Hybrid Workforce & Equipment App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-icon">MS</div>
      <div>
        <h1>manpowersupply</h1>
        <p>Hybrid app for manpower + equipment operations</p>
      </div>
    </div>
    <button id="menuToggle" class="menu-toggle" aria-label="Open menu">☰</button>
    <nav id="mainNav" class="main-nav">
      <a href="#dashboard">Dashboard</a>
      <a href="#workers">Workers</a>
      <a href="#equipment">Equipment</a>
      <a href="#projects">Projects</a>
    </nav>
  </header>

  <main>
    <section id="dashboard" class="section">
      <h2>Operational Overview</h2>
      <div id="statsGrid" class="stats-grid"></div>
    </section>

    <section class="section split">
      <div id="workers" class="card">
        <div class="card-head">
          <h3>Manpower Roster</h3>
          <input id="workerSearch" type="search" placeholder="Search by name or skill" />
        </div>
        <div id="workerTags" class="tags"></div>
        <div id="workerList" class="list"></div>
      </div>

      <div id="equipment" class="card">
        <div class="card-head">
          <h3>Equipment Inventory</h3>
          <select id="equipmentFilter">
            <option value="all">All status</option>
            <option value="available">Available</option>
            <option value="in-use">In Use</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
        <div id="equipmentList" class="list"></div>
      </div>
    </section>

    <section id="projects" class="section card">
      <div class="card-head">
        <h3>Project Allocations</h3>
        <button id="addDemoRequest" class="primary-btn">Create Demo Allocation</button>
      </div>
      <div id="allocationList" class="list"></div>
    </section>
  </main>

  <footer>
    <p>Demo app with mock JSON data • mobile responsive • ready for hybrid deployment</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
